name: smartattend
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0  
  file_picker: ^8.1.2  
  supabase_flutter: ^2.8.0  
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  geolocator: ^14.0.2
  cloud_firestore: any
  firebase_analytics: any
  firebase_core: any
  firebase_auth: any
  firebase_storage: ^13.4.3
  image_picker: ^1.2.2 
  mobile_scanner: ^7.2.0
  local_auth: ^2.3.0
  shared_preferences: ^2.3.3
  http: ^1.2.2
  excel: ^4.0.6
  csv: ^6.0.0
  
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.png
  android_12:
    image: assets/images/logo.png
    color: "#ffffff"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21